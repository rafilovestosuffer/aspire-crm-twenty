# Aspire CRM stack — Twenty + n8n, one command.
#
#   ./infra/up.sh                 first run: generates secrets, starts everything
#   docker compose -f infra/docker-compose.yml up -d
#
# The db / redis / server / worker services follow Twenty's published compose
# (packages/twenty-docker/docker-compose.yml) closely and deliberately. Where
# this file differs from upstream it is marked ASPIRE and says why — an
# unexplained divergence from upstream is how an instance stops upgrading
# cleanly.
#
# Laptop by default: ports are published on all interfaces so you can demo from
# the browser. For the VPS, add the overlay:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.vps.yml up -d

name: aspire-crm

services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD in infra/.env}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    # ASPIRE: Twenty's UI degrades past roughly 10k records without more shared
    # memory, and the n8n execution tables share this instance.
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=200
    volumes:
      - db-data:/var/lib/postgresql/data
      # ASPIRE: creates the separate n8n database on first init. Twenty owns
      # `default` and must not share it.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: twentycrm/twenty:${TAG:-v2.1.0}
    restart: always
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "${TWENTY_PORT:-3000}:3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}

      STORAGE_TYPE: ${STORAGE_TYPE:-local}

      # Losing ENCRYPTION_KEY loses every secret in the database — OAuth tokens,
      # application variables, TOTP secrets. Back it up off this host.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with openssl rand -base64 32}
      # Set to the previous key during a rotation, otherwise leave blank.
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      # Legacy: only needed by instances that predate ENCRYPTION_KEY.
      APP_SECRET: ${APP_SECRET:-}

      # Transactional email out of Twenty itself (invites, password resets, and
      # the Send Email workflow action). Optional — leave unset until SMTP exists.
      EMAIL_DRIVER: ${EMAIL_DRIVER:-logger}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

      # Mailbox and calendar sync. Threads and events land on record timelines —
      # this is the closest thing to GHL's inbox and it is native.
      MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED:-false}
      CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED:-false}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL:-}
      AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      # First boot runs the full migration set, which takes several minutes and
      # answers nothing on /healthz meanwhile. Without a start_period those
      # attempts count as failures: the container is declared unhealthy at
      # ~100s, and `worker`, which waits on service_healthy, gives up and stays
      # in Created forever. The server then goes healthy on its own and
      # everything looks fine — except no scheduled job or mailbox sync ever
      # runs, because the worker was never started.
      start_period: 300s

  worker:
    image: twentycrm/twenty:${TAG:-v2.1.0}
    restart: always
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Both must stay "true". The server already runs migrations and registers
      # cron; letting the worker do it too causes migration races and duplicate
      # scheduled jobs.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}

      EMAIL_DRIVER: ${EMAIL_DRIVER:-logger}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

      MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED:-false}
      CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED:-false}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL:-}
      AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy

  # ------------------------------------------------------------------ ASPIRE
  # n8n — the automation layer. Separate database on the same Postgres.
  n8n:
    image: n8nio/n8n:${N8N_TAG:-2.34.6}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${PG_DATABASE_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${PG_DATABASE_PASSWORD}

      # Public base for form and webhook URLs. Wrong value here produces forms
      # that render but submit nowhere.
      # n8n binds to :: (IPv6) by default and crash-loops with
      # "address '::' is not available" on hosts without IPv6.
      N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:-0.0.0.0}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}

      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}

      # Losing this loses every stored n8n credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?generate with openssl rand -base64 32}

      # Execution history is the main growth in this database.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"        # 14 days
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all  # keep until the build is trusted
      EXECUTIONS_DATA_SAVE_ON_ERROR: all

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"

      # Read by the generated workflows. server:3000 is the in-network address —
      # SERVER_URL is the browser-facing one and is not reachable from here.
      TWENTY_BASE_URL: http://server:3000
      ASPIRE_FROM_EMAIL: ${ASPIRE_FROM_EMAIL:-}
      ASPIRE_REP_IDS: ${ASPIRE_REP_IDS:-}
      # When set, VEND Send Email refuses any recipient not on this list.
      # Required for a live Gmail demo so seed and proof addresses cannot leave
      # the host. Empty in production — consent is the only send-time gate.
      LIVE_MAIL_ALLOWLIST: ${LIVE_MAIL_ALLOWLIST:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Chat alerts post to an incoming webhook — a plain JSON POST, so the
      # same node works for Slack, Mattermost, Discord and Google Chat.
      # Locally this points at the dev alert sink so the path can be proven
      # before any workspace exists; in production it is the real hook URL.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://localhost:5678/webhook/alert-sink}
      SALES_WEBHOOK_URL: ${SALES_WEBHOOK_URL:-}
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Local SMTP catcher. Accepts mail on :1025 and shows it at :8025 — nothing
  # is ever delivered outside the host.
  #
  # This exists so the send path can be exercised for real: the consent gate,
  # the template render, the messageLog write and the SMTP transaction all run
  # exactly as they will in production, without needing a mailbox and without
  # any risk of a test run reaching a live contact.
  #
  # `profiles: [dev]` keeps it out of the VPS deployment, which passes no
  # profile and therefore never starts it.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: always
    profiles: ["dev"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Nightly dump of both databases, 30-day retention. An untested backup is not
  # a backup — restore one into a scratch database before go-live.
  backup:
    image: postgres:16
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${PG_DATABASE_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      bash -c '
      while true; do
        ts=$$(date +%Y%m%d-%H%M);
        for d in default n8n; do
          pg_dump -h db -U ${PG_DATABASE_USER:-postgres} -d $$d -Fc
            -f /backups/$$d-$$ts.dump && echo "backed up $$d at $$ts";
        done;
        find /backups -name "*.dump" -mtime +30 -delete;
        sleep 86400;
      done'

volumes:
  db-data:
  server-local-data:
  n8n-data:
