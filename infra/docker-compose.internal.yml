# Overlay for an internal office server — private IP, no inbound internet.
#
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.internal.yml up -d
#
# Differs from docker-compose.vps.yml in two ways: the proxy issues its own
# certificates rather than asking Let's Encrypt (which cannot validate a server
# it is unable to reach), and no ACME email is required.
#
# Ports 80 and 443 are published on all interfaces on purpose — colleagues on
# the office network need to reach it. The app ports stay on loopback so the
# proxy is the only way in.

services:

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [server, n8n]
    ports:
      - "80:80"
      - "443:443"
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?set CRM_DOMAIN in infra/.env}
      AUTOMATION_DOMAIN: ${AUTOMATION_DOMAIN:?set AUTOMATION_DOMAIN in infra/.env}
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
      # Holds the local CA's root key. Lose this volume and Caddy generates a
      # new CA, and every machine that trusted the old one starts warning again.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      default:
        # See the note in docker-compose.vps.yml: Twenty's REST metadata API is
        # a server-side HTTP call to ${SERVER_URL}, so the server has to be able
        # to reach its own public name. Internally that name usually resolves
        # nowhere at all, so without these aliases every /rest/metadata/*
        # request answers 500 with an empty body and no log line.
        aliases:
          - ${CRM_DOMAIN:?set CRM_DOMAIN in infra/.env}
          - ${AUTOMATION_DOMAIN:?set AUTOMATION_DOMAIN in infra/.env}

  server:
    # !override replaces the base file's port list instead of adding to it.
    # Compose MERGES lists by default, so without this the service is published
    # twice — once on all interfaces from the base file and once on loopback
    # here. That fails to bind, and if it did bind it would defeat the entire
    # point of this overlay: the app would still be reachable from the internet
    # directly, bypassing the proxy and the editor allowlist.
    ports: !override
      - "127.0.0.1:${TWENTY_PORT:-3000}:3000"
    # The alias above gets the server to Caddy; this gets it past the
    # certificate. Caddy issues from its own CA here, which Node does not trust,
    # so the self-call fails TLS verification and the metadata API still 500s.
    #
    # The CA root is NOT mounted straight from caddy-data. Caddy keeps its PKI
    # at mode 0700 owned by root and this container runs as a non-root user, so
    # the read is refused and Node prints only a warning before carrying on
    # untrusting. deploy.sh copies the root out of Caddy into infra/certs/ and
    # restarts this service — bring the stack up by hand and you have to do
    # that yourself, or the object model step fails with an empty 500.
    #
    # Do NOT reach for NODE_TLS_REJECT_UNAUTHORIZED=0 instead. It would disable
    # certificate checking for every outbound call the server makes, not just
    # this one.
    environment:
      NODE_EXTRA_CA_CERTS: /certs/caddy-root.crt
    volumes:
      - ./certs:/certs:ro

  worker:
    # The worker runs workflow actions that may address the CRM by its public
    # name; same CA, same reason.
    environment:
      NODE_EXTRA_CA_CERTS: /certs/caddy-root.crt
    volumes:
      - ./certs:/certs:ro

  n8n:
    ports: !override
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none

volumes:
  caddy-data:
  caddy-config:
