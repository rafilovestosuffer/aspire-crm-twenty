# VPS overlay. Binds every port to loopback so only the reverse proxy can
# reach them, and stops keeping successful execution payloads once the build
# is trusted.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.vps.yml up -d
#
# Everything else — including which image tag runs — stays in infra/.env.

services:

  # TLS terminates here. Caddy gets and renews Let's Encrypt certificates on
  # its own — no certbot, no renewal cron, nothing to forget. It is the only
  # service publishing a public port; everything else is bound to loopback
  # below and reachable only across the compose network.
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [server, n8n]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?set CRM_DOMAIN in infra/.env}
      AUTOMATION_DOMAIN: ${AUTOMATION_DOMAIN:?set AUTOMATION_DOMAIN in infra/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in infra/.env}
      # Space-separated CIDRs allowed to reach the n8n editor. No default on
      # purpose: an empty value is a Caddyfile parse error that takes the proxy
      # down, so this fails at compose time with a message instead.
      N8N_EDITOR_ALLOWED_IPS: ${N8N_EDITOR_ALLOWED_IPS:?set N8N_EDITOR_ALLOWED_IPS in infra/.env — the office/VPN ranges allowed to open the n8n editor}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means
      # re-issuing on next start, which burns Let's Encrypt rate limit.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      default:
        # Twenty's REST metadata API is not served in-process: the server makes
        # an HTTP call to ${SERVER_URL}${path} and returns the result. So the
        # server container has to be able to reach its own public URL, or every
        # /rest/metadata/* request answers 500 with an empty body and no log
        # line — which takes the provisioner, the query validator and the stack
        # check down together, none of them naming the cause.
        #
        # These aliases resolve the public names to Caddy on the compose
        # network, so that call stays inside the host instead of going out to
        # the public IP and back. Without them it depends on the provider
        # supporting hairpin NAT, which is not something to discover at 2am.
        aliases:
          - ${CRM_DOMAIN:?set CRM_DOMAIN in infra/.env}
          - ${AUTOMATION_DOMAIN:?set AUTOMATION_DOMAIN in infra/.env}

  server:
    # !override replaces the base file's port list instead of adding to it.
    # Compose MERGES lists by default, so without this the service is published
    # twice — once on all interfaces from the base file and once on loopback
    # here. That fails to bind, and if it did bind it would defeat the entire
    # point of this overlay: the app would still be reachable from the internet
    # directly, bypassing the proxy and the editor allowlist.
    ports: !override
      - "127.0.0.1:${TWENTY_PORT:-3000}:3000"
  n8n:
    ports: !override
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none

volumes:
  caddy-data:
  caddy-config:
