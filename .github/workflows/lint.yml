name: lint

# Cheap gates that do not need Docker. They catch a broken generator or a
# shell script that will not even parse, before anyone copies it onto the VPS.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Compile Python
        run: python3 -m compileall -q scripts
      - name: Validate workflow queries offline
        run: python3 scripts/validate_workflow_queries.py --offline
      - name: Check documented counts against source
        run: python3 docs/build-handbook/verify_facts.py
      - name: Syntax-check shell
        run: |
          bash -n infra/deploy.sh
          bash -n infra/preflight.sh
          bash -n infra/init-vps-env.sh
          bash -n infra/up.sh
          bash -n infra/rebuild.sh
          bash -n infra/watchdog.sh
          bash -n infra/harden-host.sh
          bash -n infra/backup-offsite.sh
